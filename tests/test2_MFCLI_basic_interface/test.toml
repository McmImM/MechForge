name = "MechForge client basic interface"
description = "Python client (mf_core) basic interface: data model, file loading + schema validation, mechanism management, build + solve against the real C++ subprocess"


[build]
command = "cmake -S ../.. -B ../../build && cmake --build ../../build --target mf_engine"


[run]
command = "python3 test_basic.py"


[validate]
kind = "txt"
expected = "expected.txt"
