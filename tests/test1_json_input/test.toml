name = "JSON input crank-slider (REPL protocol)"
description = "CLI solver with REPL JSON input (build + solve + exit), outputs JSON Lines"


[build]
command = "cmake -S ../.. -B ../../build && cmake --build ../../build --target mf_engine"


[run]
command = "../../build/bin/mf_engine"
stdin = "input.jsonlines"


[validate]
kind = "jsonlines"
expected = "expected.jsonlines"
tolerance = 0.01
